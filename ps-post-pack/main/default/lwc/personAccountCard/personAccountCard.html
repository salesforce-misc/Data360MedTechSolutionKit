<template>
    <article class="slds-card profile-card">
        <div class="slds-card__body slds-card__body_inner">

            <template lwc:if={hasData}>

                <!-- Header -->
                <div class="header">
                    <img class="profile-photo" src={photoURL} alt="Profile picture"/>

                    <div class="header-text">
                        <h1 class="name">{name}</h1>
                        <p class="location">{billingCity}, {billingState}</p>
                    </div>
                </div>

                <div class="content-section">

                    <!-- Email -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Email:</span>
                            <a href={emailLink} class="link-text">
                                {account.data.PersonEmail}
                            </a>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:phone_portrait" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Phone:</span>
                            <a href={phoneLink} class="link-text">
                                {account.data.Phone}
                            </a>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:checkin" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Address:</span>
                            <div class="address-text">
                                {billingStreet}, {billingCity}, {billingState}, {billingPostalCode}
                            </div>
                        </div>
                    </div>

                    <hr class="custom-hr">

                    <!-- Segment -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:chart" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Segment:</span>
                            <span class="value-text">{message}</span>
                        </div>
                    </div>

                    <hr class="custom-hr">

                    <!-- Device Model -->
                    <div class="info-row">
                        <lightning-icon icon-name="standard:product" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Device Model:</span>
                            <span class="value-text">{Device_Model}</span>
                        </div>
                    </div>

                    <!-- Serial -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:scan" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Serial Number:</span>
                            <span class="value-text">{Serial_Number}</span>
                        </div>
                    </div>

                    <!-- Implant -->
                    <div class="info-row">
                        <lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>
                        <div class="info-content">
                            <span>Implant Site:</span>
                            <span class="value-text">{Implant_Site}</span>
                        </div>
                    </div>

                    

                </div>

            </template>

            <!-- NO DATA -->
            <template lwc:else>
                <div class="no-data-container">
                    <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                    <p class="no-data-text">No data found</p>
                </div>
            </template>

        </div>
    </article>
</template>
